<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Posts | SaurabhNovelist</title>

<meta name="description"
content="SaurabhNovelist की कविताएँ, शायरी और जिंदगी की सच्ची बातें।">

<meta name="author" content="Saurabh Verma">
<meta name="robots" content="index, follow">

<link rel="canonical"
href="https://saurabhnovelist.github.io/posts.html">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#0b0b0d;
    color:#f5f1e8;
    font-family:Georgia,"Noto Serif Devanagari",serif;
}


/* HEADER */

.header{
    padding:20px;
    text-align:center;
    border-bottom:1px solid rgba(212,175,55,.3);
    background:#080809;
}

.logo{
    color:#d4af37;
    font-size:25px;
    font-weight:bold;
}

.subtitle{
    color:#999;
    font-family:Arial,sans-serif;
    font-size:13px;
    margin-top:5px;
}


/* MAIN */

.container{
    max-width:1100px;
    margin:auto;
    padding:55px 18px;
}


/* HEADING */

.heading{
    text-align:center;
    margin-bottom:35px;
}

.heading h1{
    color:#d4af37;
    font-size:40px;
    margin-bottom:10px;
}

.heading p{
    color:#aaa;
    font-size:17px;
}

.line{
    width:70px;
    height:2px;
    background:#d4af37;
    margin:18px auto;
}


/* CATEGORY BUTTONS */

.categories{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:40px;
}

.category{
    border:1px solid #6f5b20;
    background:#111;
    color:#ddd;
    padding:10px 20px;
    border-radius:25px;
    cursor:pointer;
    font-family:Arial,sans-serif;
    transition:.3s;
}

.category:hover,
.category.active{
    background:#d4af37;
    color:#111;
}


/* POSTS GRID */

.posts{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
}


/* POST CARD */

.post{
    background:linear-gradient(145deg,#181818,#0e0e0e);
    border:1px solid #6f5b20;
    border-radius:18px;
    padding:12px;
    text-align:center;
    box-shadow:0 0 20px rgba(212,175,55,.08);
    transition:.3s;
    overflow:hidden;
}

.post:hover{
    transform:translateY(-5px);
    box-shadow:0 0 30px rgba(212,175,55,.20);
}


/* POST IMAGE */

.post-link{
    display:block;
    text-decoration:none;
}

.post-image{
    width:100%;
    aspect-ratio:3 / 4;
    object-fit:cover;
    display:block;
    border-radius:12px;
    cursor:pointer;
    transition:.3s;
}

.post:hover .post-image{
    transform:scale(1.02);
}


/* BACK BUTTON */

.back{
    display:block;
    width:max-content;
    margin:45px auto 0;
    padding:12px 25px;
    background:#d4af37;
    color:#111;
    border-radius:25px;
    font-family:Arial,sans-serif;
    font-weight:bold;
    text-decoration:none;
}

.back:hover{
    background:#e5c454;
}


/* MOBILE */

@media(max-width:800px){

    .posts{
        grid-template-columns:repeat(2,1fr);
    }

}


@media(max-width:550px){

    .heading h1{
        font-size:32px;
    }

    .container{
        padding:40px 15px;
    }

    .posts{
        grid-template-columns:1fr;
        gap:25px;
    }

    .post{
        max-width:500px;
        width:100%;
        margin:auto;
    }

}

</style>
</head>


<body>


<!-- HEADER -->

<header class="header">

    <div class="logo">
        ✒ SaurabhNovelist
    </div>

    <div class="subtitle">
        Where Words Become Emotions
    </div>

</header>



<!-- MAIN -->

<main class="container">


    <!-- HEADING -->

    <div class="heading">

        <h1>✍️ मेरी Posts</h1>

        <div class="line"></div>

        <p>
            कविताएँ, शायरी और जिंदगी की सच्ची बातें
        </p>

    </div>



    <!-- CATEGORY FILTER -->

    <div class="categories">

        <button
            class="category active"
            onclick="filterPosts('all',this)">
            सभी
        </button>

        <button
            class="category"
            onclick="filterPosts('poem',this)">
            ✍️ कविता
        </button>

        <button
            class="category"
            onclick="filterPosts('shayari',this)">
            ❤️ शायरी
        </button>

        <button
            class="category"
            onclick="filterPosts('thought',this)">
            💭 सच्ची बातें
        </button>

    </div>



    <!-- ================= POSTS ================= -->

    <div class="posts">


        <!-- POST 01 — MOTIVATIONAL -->

        <article class="post poem">

            <a
                href="images/saurabh_post_01_motivational.jpg"
                target="_blank"
                class="post-link">

                <img
                    src="images/saurabh_post_01_motivational.jpg"
                    alt="बस इस बार हो जाएगा — Saurabh Verma"
                    class="post-image"
                >

            </a>

        </article>



        <!-- POST 02 — SHAYARI -->

        <article class="post shayari">

            <a
                href="images/saurabh_post_02_shayari.jpg"
                target="_blank"
                class="post-link">

                <img
                    src="images/saurabh_post_02_shayari.jpg"
                    alt="शायरी — Saurabh Verma"
                    class="post-image"
                >

            </a>

        </article>



        <!-- POST 03 — KADVI SACHCHAI -->

        <article class="post thought">

            <a
                href="images/saurabh_post_03_kadvi_sachchai.jpg"
                target="_blank"
                class="post-link">

                <img
                    src="images/saurabh_post_03_kadvi_sachchai.jpg"
                    alt="कड़वी सच्चाई — Saurabh Verma"
                    class="post-image"
                >

            </a>

        </article>

<!-- POST 04 — KAVITA -->

<article class="post poem">

    <img
        src="images/kavita-06-behtar-kya-hai.png"
        alt="कविता — बेहतर क्या है — Saurabh Verma"
        class="post-image"
        loading="lazy"
    >


</article>


    <!-- BACK -->

    <a href="index.html" class="back">
        ← Home पर वापस
    </a>


</main>



<!-- ================= JAVASCRIPT ================= -->

<script>

function filterPosts(type, button){

    const posts =
        document.querySelectorAll(".post");

    const buttons =
        document.querySelectorAll(".category");


    buttons.forEach(btn => {
        btn.classList.remove("active");
    });

    button.classList.add("active");


    posts.forEach(post => {

        if(type === "all"){

            post.style.display = "";

        }

        else if(post.classList.contains(type)){

            post.style.display = "";

        }

        else{

            post.style.display = "none";

        }

    });

}

</script>


</body>
</html>
